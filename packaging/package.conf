# Homebrew/personal-devkit package config -- Content_ID/K_licensee below are
# placeholders (this isn't going through Sony's cert/submission process, just
# local DEX devkit install testing). See D:/PS3/samples/sdk/network/np/hddgame
# for the SDK's own reference example this is modeled on.

# Format: XXYYYY-XXXXYYYYY_00-XXXXXXXXXXXXXXXX (16 chars in the last segment).
Content_ID = UP0001-CRUX00001_00-CRUXPS3PORT00001

K_licensee = 0x00000000000000000000000000000001

# Free: no charge/DRM needed for a personal homebrew build.
DRMType = Free

# GameExec: appears in the Game column, executable (not just data).
ContentType = GameExec

PackageVersion = 01.00
